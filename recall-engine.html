<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MedPYQ | Active Recall</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --blue: #0f2b52; --bg: #0f172a; --card-bg: #ffffff; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #334155; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        * { box-sizing: border-box; }

        /* HEADER & PROGRESS */
        .recall-header { padding: max(15px, env(safe-area-inset-top, 15px)) 20px 15px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .btn-exit { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-exit:hover { background: rgba(255,255,255,0.2); }
        
        .progress-container { padding: 0 20px 20px; }
        .progress-bar-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; width: 100%; overflow: hidden; }
        .progress-bar-fill { background: #eebb4d; height: 100%; width: 0%; transition: width 0.3s ease; }
        .progress-stats { display: flex; justify-content: space-between; color: #94a3b8; font-size: 0.8rem; margin-top: 8px; font-weight: 600; }

        /* CARD AREA */
        .card-container { flex: 1; padding: 0 20px 20px; display: flex; justify-content: center; align-items: stretch; perspective: 1000px; }
        .flipper { position: relative; width: 100%; max-width: 800px; transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow-y: auto; display: flex; flex-direction: column; }
        .card-back { transform: rotateY(180deg); }

        /* CONTENT STYLES */
        .q-stem { font-size: 1.15rem; font-weight: 600; color: #0f172a; line-height: 1.6; margin-bottom: 20px; }
        .q-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .opt-row { padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; font-size: 1rem; color: #475569; }
        .opt-correct { border-color: #22c55e; background: #dcfce7; color: #14532d; font-weight: bold; }
        .expl-box { background: #f8fafc; border-left: 4px solid #eebb4d; padding: 15px; border-radius: 0 8px 8px 0; margin-top: 20px; font-size: 0.95rem; line-height: 1.5; color: #334155; }

        /* ACTION FOOTER */
        .action-footer { padding: 15px 20px max(20px, env(safe-area-inset-bottom, 20px)); background: #0f172a; display: flex; justify-content: center; gap: 10px; }
        .btn-show { width: 100%; max-width: 600px; padding: 18px; background: #eebb4d; color: #0f2b52; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(238, 187, 77, 0.2); transition: 0.2s; }
        .btn-show:hover { transform: translateY(-2px); }

        .grade-btn-group { display: none; width: 100%; max-width: 800px; gap: 10px; }
        .grade-btn { flex: 1; padding: 15px 5px; border: none; border-radius: 12px; font-weight: 800; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; }
        .grade-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .grade-time { font-size: 0.75rem; opacity: 0.8; font-weight: 600; margin-top: 4px; }
        
        .g-again { background: #ef4444; }
        .g-hard { background: #f59e0b; }
        .g-good { background: #22c55e; }
        .g-easy { background: #0ea5e9; }

        /* LOADING & EMPTY STATES */
        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
        
        @media (max-width: 600px) {
            .card-face { padding: 20px; }
            .q-stem { font-size: 1.05rem; }
            .grade-btn { font-size: 0.85rem; padding: 12px 2px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="loading-overlay">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; color: #eebb4d; margin-bottom: 20px;"></i>
        <h2 style="margin:0;">Building Your Deck...</h2>
        <p style="color: #94a3b8;">Fetching questions due for review today.</p>
    </div>

    <div class="overlay" id="done-overlay" style="display: none;">
        <div style="background: #166534; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
            <i class="fas fa-check" style="font-size: 40px; color: #dcfce7;"></i>
        </div>
        <h2 style="margin: 0 0 10px 0;">Session Complete!</h2>
        <p style="color: #94a3b8; max-width: 300px; margin-bottom: 30px;">You have successfully cleared your entire review queue for today. Great job!</p>
        <button onclick="window.location.href='index.html'" style="background: #eebb4d; color: #0f2b52; border: none; padding: 15px 30px; border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer;">Return to Dashboard</button>
    </div>

    <header class="recall-header">
        <div style="font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-brain" style="color: #eebb4d;"></i> Active Recall
        </div>
        <button class="btn-exit" onclick="window.location.href='index.html'">Exit</button>
    </header>

    <div class="progress-container">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill"></div></div>
        <div class="progress-stats">
            <span id="prog-text">0 / 0 Reviewed</span>
            <span>Target Exam: <span id="target-date-display" style="color:white;">Not Set</span></span>
        </div>
    </div>

    <div class="card-container">
        <div class="flipper" id="fc-flipper">
            <!-- FRONT -->
            <div class="card-face" id="card-front">
                <div id="front-content"></div>
            </div>
            <!-- BACK -->
            <div class="card-face card-back" id="card-back">
                <div id="back-content"></div>
            </div>
        </div>
    </div>

    <div class="action-footer">
        <button class="btn-show" id="btn-show-ans" onclick="window.flipCard()">Show Answer (Spacebar)</button>
        
        <div class="grade-btn-group" id="grade-buttons">
            <button class="grade-btn g-again" onclick="window.gradeCard(1)">AGAIN (1) <div class="grade-time">&lt; 10m</div></button>
            <button class="grade-btn g-hard" onclick="window.gradeCard(2)">HARD (2) <div class="grade-time" id="time-hard">1d</div></button>
            <button class="grade-btn g-good" onclick="window.gradeCard(3)">GOOD (3) <div class="grade-time" id="time-good">3d</div></button>
            <button class="grade-btn g-easy" onclick="window.gradeCard(4)">EASY (4) <div class="grade-time" id="time-easy">7d</div></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAp8tKgVyc6PC-yt0Nv4nOOtH8B8jCaSYE", 
            authDomain: "medpyq-elearning.firebaseapp.com", 
            databaseURL: "https://medpyq-elearning-default-rtdb.firebaseio.com", 
            projectId: "medpyq-elearning" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let dueQueue = [];
        let totalDue = 0;
        let currentIndex = 0;
        let currentQData = null;
        let currentBookmark = null;
        let daysToExam = 90; // Default

        // 1. Calculate Target Exam Compression
        const targetDateStr = localStorage.getItem('medpyq_target_date');
        if (targetDateStr) {
            document.getElementById('target-date-display').innerText = new Date(targetDateStr).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
            const targetTime = new Date(targetDateStr).getTime();
            daysToExam = Math.max(1, (targetTime - Date.now()) / (1000 * 60 * 60 * 24));
        }

        // 2. Authentication & Fetching
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                alert("Please log in to use Active Recall.");
                window.location.href = "index.html";
                return;
            }

            try {
                const snap = await get(ref(db, `users/${user.uid}/bookmarks`));
                const bookmarks = snap.val() || {};
                const now = Date.now();

                // Sort queue: items due longest ago appear first
                const dueItems = Object.entries(bookmarks)
                    .filter(([qid, data]) => now >= data.next_review_date)
                    .sort((a, b) => a[1].next_review_date - b[1].next_review_date);

                if (dueItems.length === 0) {
                    document.getElementById('loading-overlay').style.display = 'none';
                    document.getElementById('done-overlay').style.display = 'flex';
                    return;
                }

                totalDue = dueItems.length;
                
                // Fetch the actual question data for the due items
                for (const [qid, data] of dueItems) {
                    const qSnap = await get(ref(db, `question_banks/${data.exam}/${data.subject}`));
                    const qDataArray = qSnap.val();
                    
                    let qData = null;
                    if (Array.isArray(qDataArray)) {
                        qData = qDataArray.find(q => q && q.q === qid);
                    } else if (qDataArray) {
                        qData = Object.values(qDataArray).find(q => q && q.q === qid);
                    }

                    if (qData) {
                        dueQueue.push({ bookmark: { q_id: qid, ...data }, question: qData });
                    }
                }

                document.getElementById('loading-overlay').style.display = 'none';
                loadNextCard();

            } catch (err) {
                console.error(err);
                alert("Failed to load your deck. Check connection.");
                window.location.href = "index.html";
            }
        });

        function loadNextCard() {
            if (dueQueue.length === 0) {
                document.getElementById('done-overlay').style.display = 'flex';
                return;
            }

            // Ensure card is flipped to FRONT
            document.getElementById('fc-flipper').style.transform = 'rotateY(0deg)';
            
            // Toggle UI Buttons
            document.getElementById('btn-show-ans').style.display = 'block';
            document.getElementById('grade-buttons').style.display = 'none';

            // Update Progress
            const completed = totalDue - dueQueue.length;
            document.getElementById('prog-text').innerText = `${completed} / ${totalDue} Reviewed`;
            document.getElementById('prog-fill').style.width = `${(completed / totalDue) * 100}%`;

            const currentItem = dueQueue[0]; // Always take the first item
            currentQData = currentItem.question;
            currentBookmark = currentItem.bookmark;

            // Render Front
            let optsHtml = '';
            currentQData.options.forEach((opt, index) => {
                const letter = String.fromCharCode(65 + index);
                optsHtml += `<div class="opt-row"><strong style="color:var(--blue); margin-right:8px;">${letter}.</strong> ${opt}</div>`;
            });

            document.getElementById('front-content').innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom: 15px; font-size:0.8rem; font-weight:700; color:#94a3b8; text-transform:uppercase;">
                    <span>Step ${currentBookmark.current_step}</span>
                    <span>${currentQData.year || currentBookmark.exam}</span>
                </div>
                <div class="q-stem">${currentQData.stem}</div>
                ${currentQData.img ? `<img src="${currentQData.img}" class="q-img">` : ''}
                <div>${optsHtml}</div>
            `;

            // Calculate & Render Future Spacing Text on Buttons
            let step = currentBookmark.current_step;
            
            // Core FSRS Math (Adjusted for Target Date Compression)
            let hardDays = Math.max(1, Math.round(step * 0.5));
            let goodDays = Math.max(1, Math.round((daysToExam * 0.10) * step));
            let easyDays = Math.max(2, Math.round((daysToExam * 0.25) * step));

            document.getElementById('time-hard').innerText = `${hardDays}d`;
            document.getElementById('time-good').innerText = `${goodDays}d`;
            document.getElementById('time-easy').innerText = `${easyDays}d`;

            // Pre-render Back (Hidden until flip)
            let ansIndex = currentQData.ans_key.charCodeAt(0) - 65;
            document.getElementById('back-content').innerHTML = `
                <div class="q-stem" style="font-size:1rem; opacity:0.8;">${currentQData.stem}</div>
                <div class="opt-row opt-correct"><strong style="margin-right:8px;">${currentQData.ans_key}.</strong> ${currentQData.options[ansIndex]}</div>
                <div class="expl-box"><strong>Explanation:</strong><br>${currentQData.explanation}</div>
            `;
            
            // Scroll fronts and backs to top
            document.getElementById('card-front').scrollTop = 0;
            document.getElementById('card-back').scrollTop = 0;
        }

        window.flipCard = function() {
            document.getElementById('fc-flipper').style.transform = 'rotateY(180deg)';
            document.getElementById('btn-show-ans').style.display = 'none';
            document.getElementById('grade-buttons').style.display = 'flex';
        };

        window.gradeCard = async function(gradeNumber) {
            const user = auth.currentUser;
            if (!user) return;

            // Prevent double clicking
            document.getElementById('grade-buttons').style.display = 'none';

            let step = currentBookmark.current_step;
            let nextIntervalDays = 0;

            // Algorithm Application
            if (gradeNumber === 1) { // AGAIN
                step = 1;
                nextIntervalDays = 0; // Push to end of current queue
            } else if (gradeNumber === 2) { // HARD
                step = Math.max(1, step - 1);
                nextIntervalDays = Math.max(1, Math.round(step * 0.5));
            } else if (gradeNumber === 3) { // GOOD
                step += 1;
                nextIntervalDays = Math.max(1, Math.round((daysToExam * 0.10) * step));
            } else if (gradeNumber === 4) { // EASY
                step += 2;
                nextIntervalDays = Math.max(2, Math.round((daysToExam * 0.25) * step));
            }

            const now = Date.now();
            const nextReview = now + (nextIntervalDays * 24 * 60 * 60 * 1000);

            // Pop the item off the queue
            const item = dueQueue.shift();

            if (gradeNumber === 1) {
                // If they hit AGAIN, put it back at the end of today's queue
                item.bookmark.current_step = step;
                dueQueue.push(item);
            } else {
                // Save to Firebase immediately
                try {
                    await set(ref(db, `users/${user.uid}/bookmarks/${currentBookmark.q_id}/current_step`), step);
                    await set(ref(db, `users/${user.uid}/bookmarks/${currentBookmark.q_id}/next_review_date`), nextReview);
                } catch(e) { console.error("Sync error", e); }
            }

            loadNextCard();
        };

        // --- PRODUCTIVITY KEYBOARD SHORTCUTS ---
        document.addEventListener('keydown', function(event) {
            // Ignore keystrokes if the user is in an input field (though none exist here)
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;

            const isFlipped = document.getElementById('grade-buttons').style.display === 'flex';

            if (event.code === 'Space') {
                event.preventDefault(); // Stop page scrolling
                if (!isFlipped) window.flipCard();
            }

            if (isFlipped) {
                if (event.key === '1') window.gradeCard(1);
                if (event.key === '2') window.gradeCard(2);
                if (event.key === '3') window.gradeCard(3);
                if (event.key === '4') window.gradeCard(4);
            }
        });
    </script>
</body>
</html>
